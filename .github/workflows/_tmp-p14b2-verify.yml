name: _tmp-p14b2-verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/p14-b-cp2'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p14-b-cp2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest targeted new tests
        run: pytest -o addopts='' tests/test_admin_auth.py tests/test_rate_limit.py tests/test_audit.py -v
      - name: Pytest full suite
        run: pytest -v --cov=app --cov-report=term-missing
      - name: Ruff check
        run: ruff check app/ tests/
      - name: Ruff format check
        run: ruff format --check app/ tests/
