name: Temporary Tailwind v3.4.17 build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p14-a-tailwind-build
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Tailwind CSS
    if: github.ref == 'refs/heads/p14-a-cp1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P14-a branch
        uses: actions/checkout@v4
        with:
          ref: p14-a-cp1

      - name: Download official Tailwind v3.4.17 binary and checksums
        working-directory: server
        run: |
          mkdir -p tools
          curl --fail --location --silent --show-error \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64 \
            --output tools/tailwindcss
          curl --fail --location --silent --show-error \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/sha256sums.txt \
            --output sha256sums.txt

      - name: Verify official SHA-256 checksum
        working-directory: server
        run: |
          echo "Checksum file entries:"
          sed -n '1,20p' sha256sums.txt
          awk '
            {
              filename = $2
              sub(/\r$/, "", filename)
              sub(/^\.\//, "", filename)
              if (filename == "tailwindcss-linux-x64") {
                print $1 "  tools/tailwindcss"
                matches++
              }
            }
            END {
              if (matches != 1) {
                printf "Expected exactly one checksum entry; found %d\n", matches
                exit 1
              }
            }
          ' sha256sums.txt > tailwindcss-linux-x64.sha256
          cat tailwindcss-linux-x64.sha256
          sha256sum --check --strict tailwindcss-linux-x64.sha256

      - name: Build minified local CSS
        working-directory: server
        run: |
          chmod +x tools/tailwindcss
          echo "Using the official Tailwind v3.4.17 binary; SHA-256 was verified in the previous step."
          ./tools/tailwindcss -c tailwind.config.js -i app/static/css/input.css -o app/static/css/app.css --minify
          test -s app/static/css/app.css

      - name: Commit generated CSS to P14-a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/static/css/app.css
          if git diff --cached --quiet; then
            echo "Generated CSS is unchanged; no commit is necessary."
          else
            git commit -m "P14-a CP2b: build Tailwind CSS"
            git push origin HEAD:p14-a-cp1
          fi

      - name: Report generated CSS
        run: |
          git status --short
          git log -1 --oneline
          ls -lh server/app/static/css/app.css
