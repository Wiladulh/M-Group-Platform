name: Format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff format .
      - name: Commit if changed
        run: |
          git config user.name "mgroup-bot"
          git config user.email "bot@mgroup.local"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "P6 fix: apply ruff format to payment service and tests"
          git push origin HEAD:main
        working-directory: ${{ github.workspace }}
