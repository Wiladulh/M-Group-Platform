name: Tag Temp
on:
  workflow_dispatch:
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or verify annotated tag via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: "ef7d8ac10e6b10e004bebb1dbf1687ea21c96dd5"
          TAG_NAME: "v0.2-ws-binding"
          TAG_MESSAGE: "P13 complete: background tasks (pending_dispense_monitor + admin_session_monitor), 4 loops registered, cache_version bump audited, REFUNDED status migration 0006. CI green: 218 passed, 91.23% coverage."
          TAGGER_NAME: "mgroup-bot"
          TAGGER_EMAIL: "mgroup-bot@users.noreply.github.com"
        run: |
          set -euo pipefail

          REF_PATH="repos/${{ github.repository }}/git/refs/tags/$TAG_NAME"
          TAGS_PATH="repos/${{ github.repository }}/git/tags"

          if gh api "$REF_PATH" > ref.json 2>/dev/null; then
            OBJECT_TYPE=$(jq -r '.object.type' ref.json)
            TAG_OBJECT_SHA=$(jq -r '.object.sha' ref.json)

            if [ "$OBJECT_TYPE" != "tag" ]; then
              echo "::error::Existing ref is lightweight (object.type=$OBJECT_TYPE); refusing to treat it as annotated."
              exit 1
            fi

            gh api "$TAGS_PATH/$TAG_OBJECT_SHA" > tag.json
            jq -e \
              --arg target "$TARGET_SHA" \
              --arg message "$TAG_MESSAGE" \
              --arg name "$TAGGER_NAME" \
              --arg email "$TAGGER_EMAIL" \
              '.object.sha == $target and .object.type == "commit" and .message == $message and .tagger.name == $name and .tagger.email == $email' \
              tag.json > /dev/null

            echo "Verified existing annotated tag: $TAG_NAME"
            echo "Tag object SHA: $TAG_OBJECT_SHA"
            echo "Target commit: $TARGET_SHA"
          else
            TAG_OBJECT_SHA=$(gh api "$TAGS_PATH" \
              -X POST \
              -f tag="$TAG_NAME" \
              -f message="$TAG_MESSAGE" \
              -f object="$TARGET_SHA" \
              -f type="commit" \
              -f tagger[name]="$TAGGER_NAME" \
              -f tagger[email]="$TAGGER_EMAIL" \
              -f tagger[date]="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --jq .sha)

            echo "Created tag object: $TAG_OBJECT_SHA"
            gh api "repos/${{ github.repository }}/git/refs" \
              -X POST \
              -f ref="refs/tags/$TAG_NAME" \
              -f sha="$TAG_OBJECT_SHA"

            gh api "$REF_PATH" > ref.json
            test "$(jq -r '.object.type' ref.json)" = "tag"
            test "$(jq -r '.object.sha' ref.json)" = "$TAG_OBJECT_SHA"

            gh api "$TAGS_PATH/$TAG_OBJECT_SHA" > tag.json
            jq -e \
              --arg target "$TARGET_SHA" \
              --arg message "$TAG_MESSAGE" \
              --arg name "$TAGGER_NAME" \
              --arg email "$TAGGER_EMAIL" \
              '.object.sha == $target and .object.type == "commit" and .message == $message and .tagger.name == $name and .tagger.email == $email' \
              tag.json > /dev/null

            echo "Created and verified annotated tag: $TAG_NAME"
            echo "Tag object SHA: $TAG_OBJECT_SHA"
            echo "Target commit: $TARGET_SHA"
          fi

          jq '{ref: .ref, object_type: .object.type, object_sha: .object.sha}' ref.json
