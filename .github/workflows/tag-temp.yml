name: Tag Temp
on:
  workflow_dispatch:
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create annotated tag via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: "930d2dc280ef0c1e4bf585ce4b7f7727af43b43d"
          TAG_NAME: "v0.2.1-ws-binding"
        run: |
          set -euo pipefail
          if gh api repos/${{ github.repository }}/git/refs/tags/$TAG_NAME >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists, exiting"
            exit 0
          fi
          TAG_OBJECT_SHA=$(gh api repos/${{ github.repository }}/git/tags \
            -X POST \
            -f tag="$TAG_NAME" \
            -f message="P13-FIX1: revert REFUNDED status, align with spec v1.3 §5 (DISPENSE_FAILED + refund txn). CI green: 218 passed, 91.20% coverage." \
            -f object="$TARGET_SHA" \
            -f type="commit" \
            -f tagger[name]="mgroup-bot" \
            -f tagger[email]="mgroup-bot@users.noreply.github.com" \
            -f tagger[date]="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --jq .sha)
          echo "Tag object SHA: $TAG_OBJECT_SHA"
          gh api repos/${{ github.repository }}/git/refs \
            -X POST \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$TAG_OBJECT_SHA"
          echo "Annotated tag created: $TAG_NAME -> $TAG_OBJECT_SHA (points to $TARGET_SHA)"
