name: Tag Temp
on:
  workflow_dispatch:
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create annotated tag via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: "ef7d8ac10e6b10e004bebb1dbf1687ea21c96dd5"
          TAG_NAME: "v0.2-ws-binding"
        run: |
          set -euo pipefail
          TAG_OBJECT_SHA=$(gh api repos/${{ github.repository }}/git/tags \
            -X POST \
            -f tag="$TAG_NAME" \
            -f message="P13 complete: background tasks (pending_dispense_monitor + admin_session_monitor), 4 loops registered, cache_version bump audited, REFUNDED status migration 0006. CI green: 218 passed, 91.23% coverage." \
            -f object="$TARGET_SHA" \
            -f type="commit" \
            -f tagger[name]="mgroup-bot" \
            -f tagger[email]="mgroup-bot@users.noreply.github.com" \
            -f tagger[date]="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --jq .sha)
          echo "Tag object SHA: $TAG_OBJECT_SHA"
          gh api repos/${{ github.repository }}/git/refs \
            -X POST \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$TAG_OBJECT_SHA"
          echo "Annotated tag created: $TAG_NAME -> $TAG_OBJECT_SHA (points to $TARGET_SHA)"
          gh api repos/${{ github.repository }}/git/refs/tags/$TAG_NAME \
            --jq '{ref: .ref, object_type: .object.type, object_sha: .object.sha, target_commit: .object.url}'
