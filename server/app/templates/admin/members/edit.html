{% extends "admin/base_admin.html" %}
{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-semibold">Edit Member</h1>
  <p class="mt-1 text-sm text-slate-500">Member UID: <span class="font-mono">{{ member.member_code }}</span> (tidak dapat diubah)</p>
</div>

<form
  method="post"
  action="/admin/members/{{ member.id }}/edit"
  class="max-w-2xl space-y-5 rounded-xl border border-slate-200 bg-white p-6"
>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label class="block text-sm font-medium">
    Nama Lengkap
    <input
      name="full_name"
      value="{{ form.get('full_name', '') }}"
      required minlength="3" maxlength="100"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
    >
    {% if errors.get('full_name') %}
    <span class="mt-1 block text-xs text-red-600">{{ errors.get('full_name') }}</span>
    {% endif %}
  </label>

  <label class="block text-sm font-medium">
    NIK baru (opsional)
    <input
      name="nik" value=""
      maxlength="64" autocomplete="off"
      placeholder="Kosongkan jika tidak diubah"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
    >
    <span class="mt-1 block text-xs text-slate-500">
      NIK saat ini tidak ditampilkan. Perubahan NIK dicatat di audit log tanpa nilai NIK.
    </span>
    {% if errors.get('nik') %}
    <span class="mt-1 block text-xs text-red-600">{{ errors.get('nik') }}</span>
    {% endif %}
  </label>

  <label class="block text-sm font-medium">
    Nomor HP
    <input
      name="phone"
      value="{{ form.get('phone', '') }}"
      required placeholder="08xxxxxxxxxx"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
    >
    {% if errors.get('phone') %}
    <span class="mt-1 block text-xs text-red-600">{{ errors.get('phone') }}</span>
    {% endif %}
  </label>

  <label class="block text-sm font-medium">
    Catatan
    <textarea
      name="notes" rows="3"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2"
    >{{ form.get('notes', '') }}</textarea>
    {% if errors.get('notes') %}
    <span class="mt-1 block text-xs text-red-600">{{ errors.get('notes') }}</span>
    {% endif %}
  </label>

  {% if errors.get('csrf_token') %}
  <p class="text-sm text-red-600">{{ errors.get('csrf_token') }}</p>
  {% endif %}

  <div class="flex flex-wrap gap-2">
    <button
      type="submit"
      class="rounded-lg bg-slate-900 px-5 py-2 text-sm font-medium text-white"
    >Simpan Perubahan</button>
    <a
      href="/admin/members/{{ member.id }}"
      class="rounded-lg border border-slate-300 px-5 py-2 text-sm font-medium"
    >Batal</a>
  </div>
</form>
{% endblock %}
