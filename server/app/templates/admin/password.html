{% extends "admin/base_admin.html" %}{% block content %}<h1 class="mb-6 text-2xl font-semibold">Change password</h1>
{% if error %}<p role="alert" class="mb-4 rounded bg-red-100 p-3">{{ error }}</p>{% endif %}
<form method="post" action="/admin/settings/password" class="max-w-lg space-y-4 rounded bg-white p-6" x-data="{show:false}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="block">Current password<input name="old_password" :type="show?'text':'password'" required autocomplete="current-password" class="mt-1 w-full rounded border p-3"></label>
<label class="block">New password<input name="new_password" :type="show?'text':'password'" minlength="12" required autocomplete="new-password" class="mt-1 w-full rounded border p-3"></label>
<label class="block">Confirm password<input name="confirm_password" :type="show?'text':'password'" minlength="12" required autocomplete="new-password" class="mt-1 w-full rounded border p-3"></label>
<label><input type="checkbox" @change="show=!show"> Show passwords</label><button class="rounded bg-slate-900 px-5 py-3 text-white">Update password</button></form>{% endblock %}
